spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://localhost:5432/spring_jdbc_db
    driver-class-name: org.postgresql.Driver
  jpa:
      show-sql: true
      hibernate:
        ddl-auto:  update
        
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
